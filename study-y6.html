teElement("option");o.value=g;o.textContent=g;$("filter").append(o)}function draw(){const q=$("q").value.toLocaleLowerCase("vi"),f=$("filter").value;$("progress").textContent=Object.values(saved).filter(Boolean).length+" / "+DATA.length+" bài đã học";$("list").replaceChildren();DATA.forEach((x,i)=>{if(f&&x.g!==f||!x.t.toLocaleLowerCase("vi").includes(q))return;let card=document.createElement("div");card.className="item";let lab=document.createElement("label"),cb=document.createElement("input");cb.type="checkbox";cb.checked=!!saved[i];cb.onchange=()=>{saved[i]=cb.checked;localStorage.setItem(KEY,JSON.stringify(saved));draw()};let name=document.createElement("span");name.innerHTML="<b></b><small></small>";name.querySelector("b").textContent=x.t;name.querySelector("small").textContent=x.g;lab.append(cb,name);card.append(lab);let links=document.createElement("div");links.className="links";for(const [label,url] of [["📖 MSD tiếng Việt","https://www.google.com/search?q="+enc("site:msdmanuals.com/vi/professional "+x.t)],["▶ YouTube tiếng Việt","https://www.youtube.com/results?search_query="+enc("bài giảng sản phụ khoa "+x.t+" tiếng Việt")],["🎥 Ca lâm sàng","https://www.youtube.com/results?search_query="+enc("lâm sàng sản phụ khoa "+x.t+" tiếng Việt")]]){let a=document.createElement("a");a.href=url;a.target="_blank";a.rel="noopener noreferrer";a.textContent=label;links.append(a)}card.append(links);$("list").append(card)})} $("q").oninput=draw;$("filter").onchange=draw;draw();</script></html>
